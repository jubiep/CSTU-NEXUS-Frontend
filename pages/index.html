<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <title>CSTU NEXUS – เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/login.css"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">CSTU <span>NEXUS</span></div>
    <p class="login-tagline">ระบบรีวิวรายวิชา มหาวิทยาลัยธรรมศาสตร์</p>

    <div class="login-card">
      <div class="error-msg" id="error-msg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

      <div class="form-group">
        <label class="form-label">ชื่อผู้ใช้ (TU NetID)</label>
        <input class="form-input" type="text" id="username" placeholder="เช่น u6809617407" autocomplete="username"/>
      </div>

      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <a href="#" class="forgot-link">ลืมรหัสผ่าน?</a>

      <button class="btn btn-primary btn-full" onclick="doLogin()">เข้าสู่ระบบ</button>

      <p class="login-note">
        ระบบใช้การยืนยันตัวตนผ่าน TU Authentication<br/>
        เฉพาะนักศึกษา CSTU มธ. เท่านั้น
      </p>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    // ถ้า login แล้ว redirect ไป dashboard
    if (sessionStorage.getItem("cstu_logged_in")) {
      window.location.href = "dashboard.html";
    }

    function doLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const err = document.getElementById("error-msg");

      if (!u || !p) {
        err.textContent = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
        err.classList.add("show");
        return;
      }

      // TODO: เชื่อม TU Auth API
      // Mock: รับทุก credential
      sessionStorage.setItem("cstu_logged_in", "1");
      window.location.href = "dashboard.html";
    }

    // Enter key
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
